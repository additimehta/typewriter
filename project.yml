name: TypewriterJournal
options:
  bundleIdPrefix: com.additimehta
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
targets:
  TypewriterJournal:
    type: application
    platform: macOS
    sources:
      - path: TypewriterJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.additimehta.typewriterjournal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        ENABLE_APP_SANDBOX: YES
