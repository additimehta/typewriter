name: TypewriterJournal
options:
  bundleIdPrefix: com.additimehta
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  TypewriterJournal:
    type: application
    platform: iOS
    sources:
      - path: TypewriterJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.additimehta.typewriterjournal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
